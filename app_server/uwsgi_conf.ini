[uwsgi]
# ========== 网络配置 ==========
http = 0.0.0.0:8282
socket-timeout = 300  # 增加socket超时

# ========== 项目配置 ==========
pythonpath = /www/server/pyporject_evn/envFS
chdir = /www/wwwroot/mm_bookies/app_server
wsgi-file = app.py
callable = app

# ========== 进程和并发配置 ==========
master = true
processes = 3
threads = 2
enable-threads = true

# 关键修改：禁用lazy-apps，使用更稳定的spooler模式
lazy-apps = false  # 改为false，避免每个worker独立加载
single-interpreter = true  # 使用单一解释器模式

# ========== 优化超时设置 ==========
harakiri = 300  # 增加到300秒（5分钟）
harakiri-verbose = false  # 减少日志噪音

# ========== 减少进程重启频率 ==========
max-requests = 5000  # 增加到10000个请求
max-requests-delta = 1000  # 增加到1000，减少随机性
reload-mercy = 30  # 优雅重启等待时间

# 放宽内存限制（如果服务器内存足够）
reload-on-as = 512  # 增加到512MB
reload-on-rss = 384  # 增加到384MB

max-worker-lifetime = 28800  # 延长到8小时
worker-reload-mercy = 120   # 延长优雅关闭时间

# ========== 性能优化 ==========
post-buffering = 8192
buffer-size = 65536
listen = 1024  # 增加连接队列

# ========== 日志配置 ==========
logto = /www/wwwroot/mm_bookies/app_server/uwsgi.log
log-maxsize = 100000000  # 增加到100MB
log-slow = 5000  # 只记录超过5秒的慢请求

# 添加请求体大小限制（防止大请求）
limit-post = 10485760  # 10MB

# ========== 其他优化 ==========
vacuum = true
procname-prefix-spaced = [ox2mm_app]

# 启用心跳检查
heartbeat = 30

# 统计信息
stats = /tmp/ox2mm_stats.sock
memory-report = true

# 禁用多解释器模式（减少资源消耗）
single-interpreter = true