# ============================================================================
# MM Bookies 单套编排模板（一套 = 一个独立品牌/租户）
# 三套部署：同一份文件 + 不同 env 文件 + 不同项目名，实现端口与数据隔离。
#   docker compose --env-file env/set1.env -p mm_set1 up -d   # 主套(跑完整爬虫)
#   docker compose --env-file env/set2.env -p mm_set2 up -d   # 副本(只刷缓存)
#   docker compose --env-file env/set3.env -p mm_set3 up -d   # 副本(只刷缓存)
#
# 数据存储：MySQL 用【物理机】上的 MySQL8，三套连不同库(onex2_db_1/2/3)，
#          容器经 host.docker.internal 访问物理机 MySQL。Redis 仍每套独立容器。
# 配置/日志/上传/静态：落在 ${DATA_ROOT} 物理目录。
# ============================================================================

networks:
  mmnet:
    driver: bridge

# 复用片段：容器访问物理机 MySQL
x-host-mysql: &host-mysql
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ---------------- Redis（每套独立，实现缓存/令牌隔离）----------------
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_ROOT}/redis/data:/data
    ports:
      - "${PORT_REDIS:-16379}:6379"    # 仅供管理，可注释掉不对外
    networks: [mmnet]
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------- 移动端后台接口 ----------------
  app_server:
    <<: *host-mysql
    image: mmbookies/app_server:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      redis: {condition: service_healthy}
    environment:
      TZ: Asia/Yangon
    volumes:
      - ${DATA_ROOT}/config/app_server/.env:/app/.env:ro
      - ${DATA_ROOT}/config/app_server/.env.production:/app/.env.production:ro
      - ${DATA_ROOT}/logs/app_server:/app/logs
      - ${DATA_ROOT}/static/app_server:/app/static
    ports:
      - "${PORT_APP_SERVER:-18282}:8282"
    networks: [mmnet]
    mem_limit: 1200m

  # ---------------- 爬虫 / 缓存刷新 ----------------
  # set1: SCRAPER_ENTRY=ibet_runner2.py  完整爬取→写库→刷本套Redis
  # set2/3: SCRAPER_ENTRY=cache_only.py  只从本套(已同步)库重建本套Redis赛事缓存
  scraper:
    <<: *host-mysql
    image: mmbookies/scraper:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      redis: {condition: service_healthy}
    environment:
      TZ: Asia/Yangon
      APP_ENV: production
      SCRAPER_ENTRY: ${SCRAPER_ENTRY:-cache_only.py}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-30}
    volumes:
      - ${DATA_ROOT}/config/scraper/.env:/app/.env:ro
      - ${DATA_ROOT}/config/scraper/.env.production:/app/.env.production:ro
      - ${DATA_ROOT}/logs/scraper:/app/logs
    networks: [mmnet]
    mem_limit: 512m

  # ---------------- Java 结算服务 ----------------
  jxboot:
    <<: *host-mysql
    image: mmbookies/jxboot:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      redis: {condition: service_healthy}
    environment:
      TZ: Asia/Yangon
      JAVA_OPTS: "-server -Xms512m -Xmx${XMX_JXBOOT:-1536m} -Djava.awt.headless=true -Dfile.encoding=UTF-8"
    volumes:
      - ${DATA_ROOT}/config/jxboot:/app/config:ro
      - ${DATA_ROOT}/logs/jxboot:/app/log
    ports:
      - "${PORT_JXBOOT:-19101}:9101"
    networks: [mmnet]
    mem_limit: 2200m

  # ---------------- 管理端后端 ----------------
  jeeplus-web:
    <<: *host-mysql
    image: mmbookies/jeeplus-web:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      redis: {condition: service_healthy}
    environment:
      TZ: Asia/Yangon
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-server -Xms512m -Xmx${XMX_JEEPLUS:-1536m} -XX:+UseG1GC -Djava.awt.headless=true -Dfile.encoding=UTF-8"
    volumes:
      - ${DATA_ROOT}/config/jeeplus-web:/app/config:ro
      - ${DATA_ROOT}/logs/jeeplus-web:/app/logs
      - ${DATA_ROOT}/uploads/jeeplus:/www/wwwroot/web_manager_api/filedir
    ports:
      - "${PORT_JEEPLUS:-18082}:8082"
    networks: [mmnet]
    mem_limit: 1800m

  # ---------------- WebSocket/SSE 推送 ----------------
  jx-push:
    <<: *host-mysql
    image: mmbookies/jx-push:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      redis: {condition: service_healthy}
    environment:
      TZ: Asia/Yangon
      PROFILE: prod
      JAVA_OPTS: "-server -Xms512m -Xmx${XMX_JXPUSH:-1024m} -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.awt.headless=true -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
    volumes:
      - ${DATA_ROOT}/config/jx-push:/app/config:ro
      - ${DATA_ROOT}/logs/jx-push:/app/logs
    ports:
      - "${PORT_JXPUSH:-18090}:8090"
    networks: [mmnet]
    mem_limit: 1300m

  # ---------------- 静态前端（官方 nginx + 挂载静态产物）----------------
  uniapp-web:
    image: nginx:1.25-alpine
    restart: always
    depends_on: [app_server, jx-push]
    volumes:
      - ${UNIAPP_DIST}:/usr/share/nginx/html:ro
      - ${DATA_ROOT}/config/nginx/uniapp.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT_UNIAPP:-18080}:80"
    networks: [mmnet]
    mem_limit: 128m

  manager-web:
    image: nginx:1.25-alpine
    restart: always
    depends_on: [jeeplus-web]
    volumes:
      - ${WEB_MANAGER_DIR}:/usr/share/nginx/html:ro
      - ${DATA_ROOT}/config/nginx/web_manager.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT_MANAGER:-18081}:80"
    networks: [mmnet]
    mem_limit: 128m
