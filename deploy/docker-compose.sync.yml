# ============================================================================
# 跨库增量同步服务（全局仅 1 个容器，不属于任何一套）
#   docker compose -f docker-compose.sync.yml --env-file env/sync.env -p mm_sync up -d
# 连接物理机 MySQL，把主库(onex2_db_1)的 5 张公共表全量覆盖同步到 onex2_db_2 / onex2_db_3。
# ============================================================================
services:
  db-sync:
    image: mmbookies/db_sync:${IMAGE_TAG:-latest}
    restart: always
    environment:
      TZ: Asia/Yangon
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SYNC_SOURCE_DB: ${SYNC_SOURCE_DB:-onex2_db_1}
      SYNC_TARGET_DBS: ${SYNC_TARGET_DBS:-onex2_db_2,onex2_db_3}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-15}
      SYNC_OVERLAP_SECONDS: ${SYNC_OVERLAP_SECONDS:-5}
      SYNC_STATE_FILE: /app/state/sync_state.json
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器能访问物理机上的 MySQL
    volumes:
      - /data/mmbookies/sync/state:/app/state
      - /data/mmbookies/sync/logs:/app/logs
    mem_limit: 256m
