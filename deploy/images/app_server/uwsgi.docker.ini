[uwsgi]
# 容器内运行版：去掉了宿主机 pythonpath/绝对路径，日志走 stdout 交给 docker logs
http = 0.0.0.0:8282
chdir = /app
wsgi-file = app.py
callable = app

master = true
processes = 3
threads = 2
enable-threads = true
lazy-apps = false
single-interpreter = true

# 超时与稳定性
socket-timeout = 300
harakiri = 300
harakiri-verbose = false
max-requests = 5000
max-requests-delta = 1000
reload-mercy = 30
worker-reload-mercy = 120
max-worker-lifetime = 28800

# 内存回收阈值（容器内可按需调整；配合 compose 的 mem_limit）
reload-on-rss = 384

# 性能
post-buffering = 8192
buffer-size = 65536
listen = 1024
limit-post = 10485760

# 日志输出到 stdout（docker logs / 挂载 logs 目录二选一）
logto = /app/logs/uwsgi.log
log-maxsize = 104857600
log-slow = 5000

vacuum = true
procname-prefix-spaced = [ox2mm_app]
heartbeat = 30
memory-report = true
die-on-term = true
