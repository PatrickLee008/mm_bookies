# 管理端前端静态站点 —— 挂载 web_manager 到 /usr/share/nginx/html
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到管理端后端 jeeplus-web（容器内服务名 jeeplus-web:8082）
    location /api/ {
        proxy_pass         http://jeeplus-web:8082/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 1024m;   # 与后端 maxRequestSize=1000MB 对齐
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
