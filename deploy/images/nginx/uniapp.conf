# 移动端 uniapp (H5) 静态站点 —— 挂载 dist/build/web 到 /usr/share/nginx/html
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;   # SPA history 路由回退
    }

    # 反代到本套 app_server（容器内服务名 app_server:8282）
    location /api/ {
        proxy_pass         http://app_server:8282/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # WebSocket 推送到 jx-push（容器内服务名 jx-push:8090）
    location /ws/ {
        proxy_pass         http://jx-push:8090/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
