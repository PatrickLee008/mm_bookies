# 开发环境配置
server:
  port: 8091
  undertow:
    max-http-post-size: 10MB
    buffer-size: 1024
    direct-buffers: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: jx-push-dev
  
  cloud:
    consul:
      host: 54.151.220.75
      port: 38500
      discovery:
        enabled: false
        register: false

  # RabbitMQ 配置
  rabbitmq:
    host: 54.151.220.75
    port: 35672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms
          multiplier: 2.0

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 100ms

  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://192.168.1.200:3306/1x2_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000

  # SQL 初始化配置
  sql:
    init:
      mode: never

  # 缓存配置 - 开发环境禁用
  cache:
    type: none

  # 线程池配置
  task:
    execution:
      pool:
        core-size: 8
        max-size: 50
        queue-capacity: 100
        keep-alive: 60s
    scheduling:
      pool:
        size: 5

  # 开发工具配置
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources
    livereload:
      enabled: true

# Push 推送配置 - 开发环境
push:
  # 消息队列类型：rabbitmq 或 redis
  queue:
    type: redis

  # 数据库轮询配置
  database:
    polling:
      enabled: true
      interval-ms: 5000
      initial-delay-ms: 20000
      batch-size: 2000
      concurrent-limit: 10
      
      # App Member Message 轮询配置
      app-member:
        enabled: true
        interval-ms: 5000
        initial-delay-ms: 25000
        batch-size: 2500
        concurrent-limit: 10

  # SSE Configuration
  sse:
    enabled: false

  # WebSocket Configuration
  websocket:
    enabled: true
    heartbeat-interval: 10000

  fcm:
    enabled: fase
    credentials-path: ./config/onex2-82a65-firebase-adminsdk-fbsvc-774b89d24e.json

  apns:
    enabled: false
    production: false

# JWT Configuration
jwt:
  secret: abc123
  expiration: 43200000

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,logfile
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: ./logs/application.log
  health:
    rabbit:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true
    diskSpace:
      enabled: true

# 日志配置 - 开发环境详细日志
logging:
  level:
    root: INFO
    com.jxmicro.push: DEBUG
    org.springframework.web: DEBUG
    org.springframework.amqp: INFO
    org.springframework.data.redis: DEBUG
    org.springframework.cloud.consul: DEBUG
    reactor.netty: INFO
    io.lettuce: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB

# OpenAPI 配置 - 开发环境启用
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true

# 自定义配置
app:
  name: jx-push-dev
  version: 1.0.0
  environment: development
  debug-mode: true

# Alarm Configuration - 告警模块自定义配置
alarm:
  # 短信余额检查配置
  sms-balance-check:
    enabled: false
    cron: 0 */5 * * * ?

  # 告警重试配置
  retry:
    enabled: false
    cron: 0 */1 * * * ?  # 每5分钟检查一次待处理的告警
    expire-minutes: 60  # 告警超期时间（分钟），超过此时间不再重试

# 调试配置
debug: false
trace: false
