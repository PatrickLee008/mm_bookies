server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: jx-push

  # 激活的环境配置文件
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Consul Service Discovery
  cloud:
    consul:
      enabled: false  # 禁用 Consul 服务注册
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: false  # 禁用服务发现
        service-name: ${spring.application.name}
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # Consumer configuration
        concurrency: 5
        max-concurrency: 20
        prefetch: 10
        # Retry configuration
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0

  # Redis Configuration (for caching/rate limiting)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 3000

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:push_service}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: PushServiceHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Spring Mail Configuration
  mail:
    enabled: false
    host: ${ALARM_MAIL_HOST:smtp.gmail.com}
    port: ${ALARM_MAIL_PORT:587}
    username: ${ALARM_MAIL_USERNAME:jimmyig12345@gmail.com}
    password: ${ALARM_MAIL_PASSWORD:lcnb iqbh xzme owmc}
    from-name: ${ALARM_MAIL_FROM_NAME:Alarm System}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Push Configuration
push:
  # Message Queue Type: rabbitmq or redis
  queue:
    type: ${PUSH_QUEUE_TYPE:rabbitmq}

  # SSE Configuration
  sse:
    enabled: ${SSE_ENABLED:true}

  # WebSocket Configuration
  websocket:
    enabled: ${WEBSOCKET_ENABLED:true}
    heartbeat-interval: 30000  # 心跳间隔（毫秒）

  # FCM Configuration
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:./firebase-service-account.json}

  # APNs Configuration
  apns:
    enabled: ${APNS_ENABLED:false}
    key-path: ${APNS_KEY_PATH:./AuthKey.p8}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    topic: ${APNS_TOPIC:}
    production: ${APNS_PRODUCTION:false}

# JWT Configuration
jwt:
  # ⚠️ 重要：必须与生成 Token 的服务使用相同的密钥！
  # 当前密钥：abc123 (开发环境)
  # 生产环境请通过环境变量 JWT_SECRET 设置
  secret: ${JWT_SECRET:abc123}
  expiration: ${JWT_EXPIRATION:43200000}  # 12 hours in milliseconds

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    consul:
      enabled: false  # 禁用 Consul 健康检查
    mail:
      enabled: false  # 禁用 Mail 健康检查（Gmail 网络不可达）

# Logging Configuration
logging:
  level:
    root: INFO
    com.jxmicro.push: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

